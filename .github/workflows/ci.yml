name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the job reads the code and nothing else. It publishes no artefact and needs no
# OIDC token, so it gets neither.
permissions:
  contents: read

# One run per ref. Unlike the docs deployment, a superseded CI run is worth cancelling: its verdict
# is about a commit nobody will look at again, and nothing is left half-written when it dies.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Two legs of the same gate, which is the shape ADR-024 said this workflow would grow when a
    # calibrator first needed an optional extra — F3-A's JAX one did. The bare leg is the promise
    # that the engine runs with numpy and scipy alone: the JAX test modules are not collected there
    # (tests/parametric_pricing/conftest.py) and the contract harness runs one implementer fewer.
    # The `jax` leg is the only place that code is exercised at all, so both have to pass.
    #
    # fail-fast is off: when one leg breaks, which one is the finding.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev only
            extras: ""
          - name: with jax
            extras: "--extra jax"

    name: verify (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs the Python pinned by requires-python and the locked dev environment: pytest,
      # hypothesis, ruff, mypy and import-linter on top of numpy, scipy and typer, plus whatever
      # this leg's extra adds. torch is still an optional extra nothing here installs; the domain
      # is forbidden from importing any of them by an import-linter contract.
      #
      # --frozen: the lockfile is used as committed. A pyproject.toml edited without re-locking
      # fails here instead of resolving to something no developer has run.
      - name: Sync the environment
        run: uv sync --frozen --group dev ${{ matrix.extras }}

      # The gate itself lives in the repository, not in this file. scripts/verify.sh runs pytest,
      # ruff, ruff format --check, mypy and lint-imports, and it is the same script the developer
      # and the review agents run — one list, three callers, no drift (ADR-024). Adding a check
      # means editing that script, and it reaches CI in the same commit.
      - name: Verify
        run: bash scripts/verify.sh
