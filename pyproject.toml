[project]
name = "volengine"
version = "0.1.0"
description = "Motor de calibración de superficies de volatilidad en tiempo real, multi-mercado"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.14",
    "typer>=0.15",
]

[project.optional-dependencies]
jax = ["jax>=0.11.0", "optax>=0.2"]       
neural = ["torch>=2.13.0"]                  
deribit = ["websockets>=13", "httpx>=0.28"]  

[project.scripts]
volengine = "volengine.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volengine"]

# ---------------------------------------------------------------- tools

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: calibradores intercambiables tras el mismo puerto",
    "no_recompilation: guardián de ADR-009 (contador de compilaciones JAX)",
    "e2e: pipeline completo de punta a punta",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
packages = ["volengine"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "volengine.contracts.*",
    "volengine.shared_kernel.*",
    "volengine.market_data.domain.*",
    "volengine.parametric_pricing.domain.*",
    "volengine.neural_surface.domain.*",
    "volengine.risk.domain.*",
]
strict = true
